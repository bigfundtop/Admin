<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bigfund Admin Panel</title>
    


<style>
*,
*::before,
*::after {
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
    overflow-x: clip;
    -webkit-text-size-adjust: 100%;
}

body {
    width: 100%;
    max-width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    padding: 12px;
    overflow-x: clip;
    background: #0f172a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    text-align: center;
}

/* Responsive heading */
h1 {
    width: 100%;
    max-width: 700px;
    margin: 12px auto 20px;
    font-size: clamp(21px, 5vw, 32px);
    line-height: 1.3;
    overflow-wrap: anywhere;
}

/* Mobile-friendly buttons */
button {
    display: block;
    width: 100%;
    max-width: 340px;
    min-width: 0;
    min-height: 44px;
    margin: 10px auto;
    padding: 11px 14px;
    border: 0;
    border-radius: 9px;
    background: #16a34a;
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.35;
    white-space: normal;
    overflow-wrap: anywhere;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

button:hover {
    background: #15803d;
}

button:active {
    background: #166534;
}

button:focus-visible {
    outline: 2px solid #86efac;
    outline-offset: 2px;
}

/* Wallet, status and balance */
#wallet,
#status,
#balance {
    width: 100%;
    max-width: 600px;
    min-width: 0;
    margin: 10px auto;
    padding: 10px;
    font-size: 14px;
    line-height: 1.5;
    font-weight: 600;
    overflow-wrap: anywhere;
    word-break: break-word;
}

#wallet,
#balance {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 9px;
}

#status a {
    color: #86efac;
    overflow-wrap: anywhere;
    word-break: break-word;
}

/* Responsive chart */
.chart-container {
    position: relative;
    width: 100%;
    max-width: 900px;
    min-width: 0;
    height: clamp(190px, 55vw, 300px);
    margin: 16px auto;
    padding: 8px;
    overflow: hidden;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
}

.chart-container canvas {
    display: block;
    width: 100% !important;
    max-width: 100%;
    max-height: 100%;
}

/* Small Android phones */
@media (max-width: 360px) {
    body {
        padding: 8px;
    }

    h1 {
        margin: 10px auto 16px;
        font-size: 21px;
    }

    button {
        min-height: 42px;
        margin: 8px auto;
        padding: 10px;
        font-size: 14px;
    }

    #wallet,
    #status,
    #balance {
        margin: 8px auto;
        padding: 8px;
        font-size: 12px;
        line-height: 1.45;
    }

    .chart-container {
        height: 190px;
        margin: 12px auto;
        padding: 5px;
    }
}

/* Standard mobile phones */
@media (min-width: 361px) and (max-width: 480px) {
    body {
        padding: 10px;
    }

    h1 {
        font-size: 24px;
    }

    button {
        max-width: 100%;
    }

    .chart-container {
        height: 220px;
    }
}

/* Tablets and desktops */
@media (min-width: 768px) {
    body {
        padding: 20px;
    }

    button {
        min-height: 46px;
    }

    .chart-container {
        height: 300px;
    }
}

/* Reduced motion preference */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>

    

    
</head>
<body>

<h1>Bigfund Admin Panel</h1>

<button id="connectBtn">Connect Wallet</button>
<p id="wallet">Not Connected</p>
<p id="status"></p>
<p id="balance"></p>

<button id="withdrawBtn">Withdraw Tax USDT</button>

<!-- Load Ethers.js and Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>

<!-- Load app.js after libraries -->
<script src="app.js" defer></script>

</body>
</html>
