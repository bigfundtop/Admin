<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bigfund Admin Panel</title>
    

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 14px;
    min-height: 100vh;
    background: #0f172a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: clamp(24px, 5vw, 34px);
    margin: 18px 0 28px;
    line-height: 1.3;
    overflow-wrap: anywhere;
}

button {
    display: block;
    width: 100%;
    max-width: 360px;
    min-height: 50px;
    margin: 14px auto;
    padding: 14px 20px;
    background: #16a34a;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

button:hover {
    background: #15803d;
}

button:active {
    background: #166534;
}

button:focus-visible {
    outline: 3px solid #86efac;
    outline-offset: 3px;
}

#wallet,
#status,
#balance {
    width: 100%;
    max-width: 600px;
    margin: 14px auto;
    padding: 12px;
    font-size: 15px;
    line-height: 1.6;
    font-weight: 600;
    overflow-wrap: anywhere;
    word-break: break-word;
}

#wallet,
#balance {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
}

#status a {
    color: #86efac;
    overflow-wrap: anywhere;
}

.chart-container {
    position: relative;
    width: 100%;
    max-width: 900px;
    height: 280px;
    margin: 24px auto;
    padding: 12px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
}

canvas {
    max-width: 100%;
}

@media (max-width: 480px) {
    body {
        padding: 16px 12px;
    }

    h1 {
        margin: 14px 0 22px;
        font-size: 25px;
    }

    button {
        max-width: 100%;
        min-height: 52px;
        margin: 12px auto;
        font-size: 16px;
    }

    #wallet,
    #status,
    #balance {
        font-size: 14px;
        padding: 10px;
    }

    .chart-container {
        height: 240px;
        padding: 8px;
    }
}

@media (prefers-reduced-motion: reduce) {
    button {
        scroll-behavior: auto;
    }
}
</style>
    

    
</head>
<body>

<h1>Bigfund Admin Panel</h1>

<button id="connectBtn">Connect Wallet</button>
<p id="wallet">Not Connected</p>
<p id="status"></p>
<p id="balance"></p>

<button id="withdrawBtn">Withdraw Tax USDT</button>

<!-- Load Ethers.js and Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>

<!-- Load app.js after libraries -->
<script src="app.js" defer></script>

</body>
</html>
